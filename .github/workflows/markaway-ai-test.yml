name: MarkAway AI Removal Emulator Test
on:
  workflow_dispatch:
  push:
    paths:
      - 'ai-tests/**'
      - '.github/workflows/markaway-ai-test.yml'
permissions:
  contents: read
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare source, model and test media
        run: |
          set -e
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg python3-numpy fonts-dejavu-core >/dev/null
          unzip -q MarkAwayAI_v0.27.1_Reviewed_Source_Fixed.zip -d source
          for p in patches/*.patch; do patch -d source/MarkAwayAI -p1 --forward --fuzz=0 < "$p"; done
          ffmpeg -v error -f lavfi -i "gradients=s=640x360:r=15:d=3:c0=0x286ea0:c1=0xd2aa5a:speed=0.02" \
            -f lavfi -i "sine=frequency=440:duration=3" -c:v libx264 -qp 0 -pix_fmt yuv420p -c:a aac -shortest clean.mp4
          ffmpeg -v error -i clean.mp4 -vf "drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text=SAMPLE:fontcolor=white:fontsize=40:x=(w-tw)/2:y=(h-th)/2" \
            -c:v libx264 -qp 0 -pix_fmt yuv420p -c:a copy input.mp4
          cd source/MarkAwayAI
          mkdir -p app/src/main/assets/models app/src/androidTest/assets app/src/androidTest/java/com/markaway/ai
          curl -LsSf --retry 3 -o app/src/main/assets/models/migan_fp16.tflite \
            "https://huggingface.co/litert-community/MI-GAN-512-Places2-LiteRT/resolve/179a35d8e8a518f6253f9c42fc9b412c6438cf7c/migan_fp16.tflite"
          cp "$GITHUB_WORKSPACE/input.mp4" app/src/androidTest/assets/
          cp "$GITHUB_WORKSPACE/ai-tests/AiRemovalTest.kt" app/src/androidTest/java/com/markaway/ai/
          cat >> app/build.gradle.kts <<'G'

          android { defaultConfig { testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner" } }
          dependencies {
              androidTestImplementation("androidx.test:runner:1.6.2")
              androidTestImplementation("androidx.test.ext:junit:1.2.1")
          }
          G
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on emulator (as shipped, then CPU diagnostic)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          arch: x86_64
          ram-size: 4096M
          disk-size: 6G
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            cd source/MarkAwayAI && bash "$GITHUB_WORKSPACE/ai-tests/run.sh" as-shipped
            sed -i 's/Accelerator\.GPU/Accelerator.CPU/' source/MarkAwayAI/app/src/main/java/com/markaway/ai/LiteRtMiganInpaintingEngine.kt
            cd source/MarkAwayAI && bash "$GITHUB_WORKSPACE/ai-tests/run.sh" cpu-diagnostic
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MarkAwayAI-ai-test-results
          path: results/
          retention-days: 14
